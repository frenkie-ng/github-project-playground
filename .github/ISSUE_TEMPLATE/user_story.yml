    attributes:
      value: |
        ## Context
        - **Epic**: #[Epic-Issue-Number]
        - **Spec**: [Link to doc/requirement/...]

        ## Description
        Summarize the user value.

        ## Acceptance Criteria
        - [ ] Criterion 1
        - [ ] Criterion 2
